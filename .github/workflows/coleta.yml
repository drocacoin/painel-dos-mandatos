# Coleta diária: roda os coletores, valida, faz commit só se algum dado mudou e publica.
# Se alguma coleta falhar, as outras são gravadas, os dados antigos daquela ficam intactos,
# a issue "Falha na coleta automática" recebe a lista das fontes que falharam e o workflow
# termina em vermelho (regra 3). Quando tudo volta a funcionar, a issue é fechada.
# Para rodar na hora: aba Actions → "Coleta diária" → Run workflow.
name: Coleta diária

on:
  schedule:
    # Todo dia às 10h17 de Brasília: depois das divulgações do IBGE, que costumam sair às 9h.
    # O minuto 17 evita o pico do início da hora, quando o GitHub pode atrasar execuções.
    - cron: '17 10 * * *'
      timezone: 'America/Sao_Paulo'
  workflow_dispatch:

permissions:
  contents: write # gravar os dados no repositório
  issues: write # abrir issue quando falhar
  actions: write # disparar o CI depois do commit

concurrency:
  group: coleta
  cancel-in-progress: false

jobs:
  coletar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci

      - name: Coletar os indicadores, os gastos e o Congresso
        id: coleta
        continue-on-error: true
        # O log fica salvo para a issue dizer qual fonte falhou (o log do GitHub só abre com login).
        run: npm run coletar 2>&1 | tee coleta.log

      - name: Gravar no repositório (só se algum dado mudou)
        id: commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          # Só os dados coletados. O robô nunca mexe em promessas.
          git add data/*/indicadores data/*/gastos data/*/congresso
          if git diff --cached --quiet; then
            echo "Nenhum dado mudou."
            echo "mudou=nao" >> "$GITHUB_OUTPUT"
          else
            git commit -m "Coleta automática de $(TZ=America/Sao_Paulo date +%d/%m/%Y)"
            git pull --rebase
            git push
            echo "mudou=sim" >> "$GITHUB_OUTPUT"
          fi

      # Commits feitos pelo robô não disparam outros workflows sozinhos; por isso o CI
      # (que testa e publica o site) é chamado aqui.
      - name: Testar e publicar o site
        if: steps.commit.outputs.mudou == 'sim'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run ci.yml --ref main

      - name: Abrir issue se a coleta falhou
        if: steps.coleta.outcome == 'failure'
        env:
          GH_TOKEN: ${{ github.token }}
          DETALHES: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          # Linhas que começam com ✗ = fontes que falharam, com o motivo.
          falhas=$(grep '^✗' coleta.log | sed 's/^/- /' || true)
          [ -n "$falhas" ] || falhas="- O erro aconteceu antes da lista de fontes; veja os detalhes."
          corpo=$(printf 'Coleta de %s. Os dados anteriores destas fontes foram mantidos:\n\n%s\n\nDetalhes (com login): %s' \
            "$(TZ=America/Sao_Paulo date '+%d/%m/%Y')" "$falhas" "$DETALHES")
          printf '### Fontes que falharam\n\n%s\n' "$falhas" >> "$GITHUB_STEP_SUMMARY"
          gh label create coleta --color B60205 --description "Falhas da coleta automática" --force
          aberta=$(gh issue list --state open --label coleta --json number --jq '.[0].number // empty')
          if [ -z "$aberta" ]; then
            gh issue create --label coleta --title "Falha na coleta automática" --body "$corpo"
          else
            # Uma issue só, com um comentário por dia de falha (histórico sem duplicar issues).
            gh issue comment "$aberta" --body "$corpo"
          fi

      # Issue aberta = coleta falhando agora. Quando tudo volta a funcionar, ela é fechada.
      - name: Fechar a issue de falha quando a coleta volta a funcionar
        if: steps.coleta.outcome == 'success'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          for numero in $(gh issue list --state open --label coleta --json number --jq '.[].number' || true); do
            gh issue close "$numero" --comment "A coleta de $(TZ=America/Sao_Paulo date '+%d/%m/%Y') funcionou em todas as fontes."
          done

      - name: Terminar em vermelho se a coleta falhou
        if: steps.coleta.outcome == 'failure'
        run: exit 1
